name: Install PWA package

on:
  push:
    paths:
      - 'pwa.zip.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and install package
        shell: bash
        run: |
          if [ ! -f pwa.zip.b64 ]; then
            echo "No package payload found; nothing to do."
            exit 0
          fi
          base64 --decode pwa.zip.b64 > /tmp/numeri-relativi.zip
          unzip -o /tmp/numeri-relativi.zip -d .
          rm -f pwa.zip.b64 icons/icon-192.b64

      - name: Commit generated PWA files
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install NUMERI RELATIVI PWA"
          git push
