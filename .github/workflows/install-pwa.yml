name: Install PWA package

on:
  push:
    paths:
      - 'pwa.ready'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild, decode and install package
        shell: bash
        run: |
          if [ ! -f pwa.ready ]; then
            echo "No ready marker found; nothing to do."
            exit 0
          fi
          cat pwa.parts/part-* > /tmp/pwa.zip.b64
          base64 --decode /tmp/pwa.zip.b64 > /tmp/numeri-relativi.zip
          unzip -o /tmp/numeri-relativi.zip -d .
          rm -rf pwa.parts pwa.ready icons/icon-192.b64

      - name: Commit generated PWA files
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install NUMERI RELATIVI PWA"
          git push
